<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guisad Rerouting Prototype</title>
<!-- An empty icon, so the browser does not report a missing favicon during the demo. -->
<link rel="icon" href="data:,">
<!-- Leaflet is the map library. It is stored locally so it loads without internet. -->
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<script src="/static/leaflet/leaflet.js"></script>
<style>
  /* Basic layout on purpose: controls and results on the left, map filling the rest. */
  html, body { height: 100%; margin: 0; font: 14px/1.4 Arial, sans-serif; color: #222; background: #fff; }
  #layout { display: flex; height: 100%; }
  #panel { width: 400px; flex: none; overflow-y: auto; padding: 10px 12px; box-sizing: border-box; border-right: 1px solid #bbb; }
  #map { flex: 1; background: #eee; cursor: crosshair; }
  h1 { font-size: 17px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 14px 0 4px; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
  label { display: block; margin-bottom: 5px; }
  select { width: 100%; padding: 3px; }
  button { padding: 5px 8px; margin: 2px 2px 2px 0; cursor: pointer; }
  .warn { background: #fde7ea; border: 1px solid #b00020; padding: 6px; margin: 6px 0; }
  .ok { background: #e6f4e8; border: 1px solid #2e7d32; padding: 6px; margin: 6px 0; }
  .hint { background: #eaf1fb; border: 1px solid #1a56c4; padding: 6px; margin: 6px 0; }
  .small { font-size: 12px; color: #555; }
  /* Each map key row: a fixed-width box for the sample, then its label. */
  .keyRow { display: flex; align-items: center; margin: 3px 0; }
  .sample { width: 30px; flex: none; display: flex; justify-content: center; margin-right: 6px; }
  .line { width: 28px; }
  .dot { border-radius: 50%; box-sizing: border-box; }
  #assumptions { margin-top: 6px; }
</style>
</head>
<body>
<div id="layout">
  <div id="panel">
    <h1>Guisad Rerouting System</h1>
    <label>Travel mode
      <select id="mode"><option value="vehicle">Vehicle (rescue)</option><option value="walking">Walking (evacuees)</option></select>
    </label>
    <label>Go to
      <select id="target"></select>
    </label>

    <h2>Clicking the map will</h2>
    <label><input type="radio" name="tool" value="start" checked> Set the starting point</label>
    <label><input type="radio" name="tool" value="close"> Close or reopen a road</label>
    <button id="reset">Reopen all roads</button>
    <span id="closedCount" class="small"></span>

    <div id="status"></div>

    <h2>Legend</h2>
    <div id="mapKey" class="small"></div>
    <div id="assumptions" class="small"></div>

    <h2>Demo closure</h2>
    <label><select id="scenario"></select></label>
  </div>
  <div id="map"></div>
</div>

<script>
// What the user has currently chosen. The start stays empty until the map is clicked.
const choice = { mode: "vehicle", target: "any", lat: null, lon: null };
// Data from the server, and the shapes drawn on the map, stored by id.
let network = null, closed = new Set(), lastState = null, startMarker = null, startLink = null;
const roadLines = {}, pointMarkers = {};

// Canvas drawing handles thousands of roads smoothly.
const map = L.map("map", { renderer: L.canvas({ tolerance: 3 }) });
// How close to a road, in screen pixels, a click must be to count as clicking it.
const ROAD_CLICK_PIXELS = 14;
// The highlight showing which road would close, and when the last hover check ran.
let previewLine = null, lastHoverTime = 0;
// The background map needs internet. If it fails, our own roads still draw on a blank background.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  // Fading the background makes our own roads, closures and routes stand out.
  maxZoom: 19, opacity: 0.4, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

// Sends a request to the backend and returns its JSON answer.
async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const response = await fetch(path, options);
  return response.json();
}

// Makes text from the data safe to place in the page.
function safe(text) {
  const holder = document.createElement("span");
  holder.textContent = text;
  return holder.innerHTML;
}

// Formats a travel time for reading aloud in the demo.
const minutes = (seconds) => (seconds / 60).toFixed(1) + " min";

// Tells which click tool is selected: "start" or "close".
const currentTool = () => document.querySelector('input[name="tool"]:checked').value;

// The blue current route comes from D* Lite, which repairs its earlier search after
// each closure. Dijkstra gives the orange "before" route and the marker colors, and
// the backend still runs it to check D* Lite.
// Chooses how each road looks, based on the mode, closures and current route.
function styleRoad(segment) {
  const hasRoute = lastState && lastState.start && lastState.dstar.found;
  const hadRoute = lastState && lastState.start && lastState.before_route.found;
  const route = hasRoute ? new Set(lastState.dstar.segments) : new Set();
  const before = hadRoute ? new Set(lastState.before_route.segments) : new Set();
  if (closed.has(segment.id)) return { color: "#e00000", weight: 6, opacity: 1 };
  if (route.has(segment.id)) return { color: "#1a56c4", weight: 6, opacity: 1 };
  if (before.has(segment.id)) return { color: "#f39c12", weight: 5, opacity: 0.9 };
  // Roads outside Guisad are only used to reach outside destinations, so they are faint.
  const fade = segment.in_study_area ? 1 : 0.3;
  if (choice.mode === "vehicle" && !segment.drivable) return { color: "#c9c9c9", weight: 1, opacity: 0.7 * fade };
  return { color: "#555", weight: segment.drivable ? 2 : 1.5, opacity: 0.85 * fade };
}

// Sets the starting point, then updates the results. The backend refuses spots
// outside Guisad, and then the previous starting point is kept.
async function setStart(lat, lon) {
  const previous = [choice.lat, choice.lon];
  choice.lat = lat;
  choice.lon = lon;
  const error = await refresh();
  if (error) {
    [choice.lat, choice.lon] = previous;
    document.getElementById("status").innerHTML = `<div class="warn">${safe(error)}</div>`;
  }
}

// Makes a map marker clickable. In "close" mode a marker must not block the road
// underneath it, so the click goes to that road instead of running the marker's action.
function onMarkerClick(marker, action) {
  marker.on("click", (event) => {
    L.DomEvent.stopPropagation(event);
    if (currentTool() === "close") closeRoadAt(event.latlng);
    else action();
  });
}

// Finds the road closest to a map position, or null if none is close enough.
function nearestRoad(latlng) {
  const cursor = map.latLngToLayerPoint(latlng);
  let best = null, bestDistance = ROAD_CLICK_PIXELS;
  for (const { segment } of Object.values(roadLines)) {
    // In vehicle mode, footpaths are not candidates, unless closed and waiting to be reopened.
    if (choice.mode === "vehicle" && !segment.drivable && !closed.has(segment.id)) continue;
    // Roads are drawn as chains of short straight pieces, so check each piece.
    const points = segment.line.map((position) => map.latLngToLayerPoint(position));
    for (let i = 0; i + 1 < points.length; i++) {
      const distance = L.LineUtil.pointToSegmentDistance(cursor, points[i], points[i + 1]);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = segment;
      }
    }
  }
  return best;
}

// Closes or reopens the road nearest the clicked position.
async function closeRoadAt(latlng) {
  const segment = nearestRoad(latlng);
  if (!segment) return;
  await api("/api/toggle", { segment: segment.id });
  await refresh();
}

// Highlights a road and shows its name. Passing null removes the highlight.
function showPreview(segment, latlng) {
  if (previewLine) map.removeLayer(previewLine);
  previewLine = null;
  if (!segment) return;
  const action = closed.has(segment.id) ? "Click to reopen" : "Click to close";
  previewLine = L.polyline(segment.line, { color: "#ff00c8", weight: 7, opacity: 0.8, interactive: false }).addTo(map);
  previewLine.bindTooltip(`${safe(segment.name || "Unnamed " + segment.highway)}, ${Math.round(segment.length_m)} m. ${action}.`).openTooltip(latlng);
}

// Draws everything once, when the page first opens.
function drawMap() {
  // Barangay outlines. interactive:false lets clicks pass through to the map.
  const outlines = network.boundaries.map((boundary) =>
    L.polygon(boundary.ring, { color: "#1f7a8c", weight: 2, fill: false, dashArray: "6 4", interactive: false }).addTo(map));
  // Draw each road. interactive:false because the map's own click handler finds the
  // road, using nearestRoad() below. Leaflet's built-in check picks the topmost road
  // near the click rather than the closest, which often closed the wrong road.
  for (const segment of network.segments) {
    const line = L.polyline(segment.line, { ...styleRoad(segment), interactive: false }).addTo(map);
    roadLines[segment.id] = { line, segment };
  }
  // A map click does what the selected tool says.
  map.on("click", (event) => {
    if (currentTool() === "start") setStart(event.latlng.lat, event.latlng.lng);
    else closeRoadAt(event.latlng);
  });
  // In "close" mode, highlight the road the cursor is nearest to, before clicking.
  map.on("mousemove", (event) => {
    // Checking every road on every tiny movement is wasteful, so wait 60 ms between checks.
    if (currentTool() !== "close" || event.originalEvent.timeStamp - lastHoverTime < 60) return;
    lastHoverTime = event.originalEvent.timeStamp;
    showPreview(nearestRoad(event.latlng), event.latlng);
  });
  map.on("mouseout", () => showPreview(null));
  // Draw destinations in purple. Clicking one selects it in the "Go to" menu.
  for (const place of network.destinations) {
    const marker = L.circleMarker([place.lat, place.lon], { radius: 7, color: "#4a148c", fillColor: "#8e24aa", fillOpacity: 1, weight: 1 })
      .bindTooltip(`${safe(place.name)} (${safe(place.type)})<br>${safe(place.source)}`).addTo(map);
    onMarkerClick(marker, () => setTarget("place:" + place.id));
  }
  // Draw the demo markers. Their color is the isolation check. Clicking one starts from there.
  for (const point of network.points) {
    const marker = L.circleMarker([point.lat, point.lon], { radius: 6, color: "#000", weight: 1, fillColor: "#2e9e3f", fillOpacity: 1 })
      .bindTooltip(point.name).addTo(map);
    onMarkerClick(marker, () => setStart(point.lat, point.lon));
    pointMarkers[point.id] = marker;
  }
  // Zoom to fit Guisad.
  map.fitBounds(L.featureGroup(outlines).getBounds().pad(0.15));
}

// Shows the starting point and links it to the road junction it was connected to.
function drawStart(state) {
  if (startMarker) map.removeLayer(startMarker);
  if (startLink) map.removeLayer(startLink);
  if (!state.start) return;
  startLink = L.polyline([[choice.lat, choice.lon], [state.start.lat, state.start.lon]],
    { color: "#1a56c4", weight: 2, dashArray: "4 4", interactive: false }).addTo(map);
  startMarker = L.circleMarker([choice.lat, choice.lon],
    { radius: 9, color: "#fff", weight: 3, fillColor: "#1a56c4", fillOpacity: 1, interactive: false }).addTo(map);
}

// Updates all the results using the latest answer from the backend.
function showState(state) {
  lastState = state;
  closed = new Set(state.closed);
  document.getElementById("closedCount").textContent = `${closed.size} road segment(s) closed`;
  // Recolor the roads.
  for (const { line, segment } of Object.values(roadLines)) line.setStyle(styleRoad(segment));
  // Keep the route and closures on top of the other roads.
  if (state.start && state.dstar.found) for (const id of state.dstar.segments) roadLines[id].line.bringToFront();
  for (const id of closed) roadLines[id].line.bringToFront();
  // Recolor the demo markers using this mode's isolation result.
  const cutOff = new Set(state.cut_off);
  for (const [id, marker] of Object.entries(pointMarkers)) {
    marker.setStyle({ fillColor: cutOff.has(id) ? "#e00000" : "#2e9e3f" });
  }
  drawStart(state);
  showStatus(state);
  showMapKey(state);
}

// A map key sample drawn like a road on the map: same color, thickness and opacity.
const lineSample = (color, weight, opacity) =>
  `<span class="line" style="height:${weight}px;background:${color};opacity:${opacity}"></span>`;

// A map key sample drawn like a marker on the map: same size, fill and border.
const dotSample = (fill, radius, border, borderWidth) =>
  `<span class="dot" style="width:${radius * 2}px;height:${radius * 2}px;background:${fill};border:${borderWidth}px solid ${border}"></span>`;

// Builds the map key, listing only what is actually on the map right now.
function showMapKey(state) {
  const rows = [];
  const add = (sample, label) =>
    rows.push(`<div class="keyRow"><span class="sample">${sample}</span>${label}</div>`);
  const hasRoute = state.start && state.dstar.found && state.dstar.segments.length > 0;
  // The orange "before" route shows only where it differs from the current route.
  const current = new Set(hasRoute ? state.dstar.segments : []);
  const hadRoute = state.start && state.before_route.found;
  const beforeVisible = hadRoute && state.before_route.segments.some((id) => !current.has(id) && !closed.has(id));

  add(lineSample("#555", 2, 0.85), choice.mode === "vehicle" ? "Road a vehicle can use" : "Road or path a walker can use");
  if (choice.mode === "vehicle") add(lineSample("#c9c9c9", 2, 0.7), "Footpath or stairs (walkers only)");
  add(lineSample("#555", 2, 0.85 * 0.3), "Outside Guisad (used only to reach destinations)");
  add(`<span class="line" style="height:0;border-top:2px dashed #1f7a8c"></span>`, "Guisad Central and Guisad Surong boundary");
  if (hasRoute) add(lineSample("#1a56c4", 6, 1), "Current route");
  if (beforeVisible) add(lineSample("#f39c12", 5, 0.9), "Route before closures");
  if (closed.size) add(lineSample("#e00000", 6, 1), "Closed road");
  if (state.start) add(dotSample("#1a56c4", 9, "#fff", 3), "Starting point");
  add(dotSample("#8e24aa", 7, "#4a148c", 1), "Destination (click to select)");
  add(dotSample("#2e9e3f", 6, "#000", 1), "Demo marker");
  if (state.cut_off.length) add(dotSample("#e00000", 6, "#000", 1), "Demo marker, cut off");
  if (currentTool() === "close") add(lineSample("#ff00c8", 7, 0.8), "Road under the cursor (click to close or reopen)");
  document.getElementById("mapKey").innerHTML = rows.join("");
}

// Shows a message only when the map alone would not explain what is happening.
function showStatus(state) {
  const area = document.getElementById("status");
  if (!state.start) {
    area.innerHTML = `<div class="hint">Click the map to choose a starting point.</div>`;
    return;
  }
  const now = state.dstar;
  // Warn if the click was far from any usable road, since the route starts at that road.
  const far = state.start.snap_m > 100
    ? `<div class="warn">Nearest usable road is ${Math.round(state.start.snap_m)} m from this spot, so the route starts there.</div>` : "";
  if (!now.found) {
    const other = state.other_mode;
    const alternative = other.found
      ? `<div class="ok">A ${other.mode} route still exists (${minutes(other.time_s)}). Switch the travel mode to see it.</div>`
      : `<div class="warn">No ${other.mode} route either. This spot is fully cut off from this destination.</div>`;
    area.innerHTML = far + `<div class="warn"><b>No ${choice.mode} route.</b> Open roads cannot reach this destination.</div>` + alternative;
    return;
  }
  // A start connected to the destination's own junction has no route to draw.
  const atDestination = now.segments.length === 0
    ? `<div class="hint">This spot connects directly to ${safe(now.destination.join(", "))}, so no travel is needed. Click farther away, or choose another destination.</div>` : "";
  area.innerHTML = far + atDestination;
}

// Asks the backend for the current results, then displays them.
// Returns the backend's error message if it refused the request.
async function refresh() {
  const query = { mode: choice.mode, target: choice.target };
  // Include the start only once one has been chosen.
  if (choice.lat !== null) { query.lat = choice.lat; query.lon = choice.lon; }
  const state = await api("/api/state?" + new URLSearchParams(query).toString());
  if (state.error) return state.error;
  showState(state);
}

// Selects a destination in the menu and updates the results.
function setTarget(value) {
  choice.target = value;
  document.getElementById("target").value = value;
  refresh();
}

// Fills the "Go to" menu: nearest of a type first, then each specific destination.
function fillDestinationMenu() {
  const types = [...new Set(network.destinations.map((place) => place.type))];
  let html = `<optgroup label="Nearest"><option value="any">Nearest of any type</option>` +
    types.map((type) => `<option value="${safe(type)}">Nearest ${safe(type)}</option>`).join("") + `</optgroup>`;
  for (const type of types) {
    const places = network.destinations.filter((place) => place.type === type);
    html += `<optgroup label="${safe(type)}">` +
      places.map((place) => `<option value="place:${safe(place.id)}">${safe(place.name)}</option>`).join("") + `</optgroup>`;
  }
  document.getElementById("target").innerHTML = html;
}

// Connects the controls on the left to the backend.
function connectControls() {
  fillDestinationMenu();
  // Remove the road highlight when switching back to setting the starting point.
  document.querySelectorAll('input[name="tool"]').forEach((radio) => {
    radio.onchange = () => { showPreview(null); showMapKey(lastState); };
  });
  document.getElementById("mode").onchange = (event) => { choice.mode = event.target.value; refresh(); };
  document.getElementById("target").onchange = (event) => setTarget(event.target.value);
  const scenarioMenu = document.getElementById("scenario");
  document.getElementById("reset").onclick = async () => {
    await api("/api/reset", {});
    scenarioMenu.value = "";
    await refresh();
  };
  // Prepared closures, so the demo does not depend on finding the right roads live.
  scenarioMenu.innerHTML = `<option value="">None</option>` +
    network.scenarios.map((name, index) => `<option value="${index}">${safe(name)}</option>`).join("");
  scenarioMenu.onchange = async () => {
    if (scenarioMenu.value === "") return;
    const answer = await api("/api/scenario", { index: Number(scenarioMenu.value) });
    // Each closure was chosen for one demo point and the nearest destination of any type.
    choice.target = "any";
    document.getElementById("target").value = "any";
    await setStart(answer.lat, answer.lon);
    // Move the map so the closed roads and the starting point are both in view.
    const closedLines = [...closed].map((id) => roadLines[id].line);
    const view = L.featureGroup([startMarker, ...closedLines]).getBounds();
    map.fitBounds(view.pad(1.5), { maxZoom: 17 });
  };
  document.getElementById("assumptions").textContent =
    `Assumed speeds: vehicle ${network.speeds.vehicle} km/h, walking ${network.speeds.walking} km/h. Facilities unverified.`;
}

// Runs once when the page opens: load the data, draw it, show the first results.
(async function start() {
  network = await api("/api/network");
  connectControls();
  drawMap();
  await refresh();
})();
</script>
</body>
</html>
